worker_processes  1;
error_log  /dev/stderr info;

events {
    worker_connections  1024;
}

http {
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;

    server {
        listen 443 ssl;
        http2 on;
        server_name probe-lab.local;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        root /usr/share/nginx/html;

        # small dynamic-ish endpoint (for testing probe fallback behaviour)
        location = /small {
            return 200 "hello";
        }
    }
}
