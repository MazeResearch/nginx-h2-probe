name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is EOL and no longer on the newest runner image, so test it
          # on an older one that still provides it.
          - { python-version: "3.8", os: ubuntu-22.04 }
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Standalone build is in sync
        run: |
          python scripts/build_standalone.py
          git diff --exit-code -- nginx-h2-probe.py
      - name: Install and smoke test
        run: |
          pip install .
          nginx-h2-probe --version
          nginx-h2-probe --help
          nginx-h2-probe check --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nginx-h2-probe:ci .
      - name: Smoke test image
        run: docker run --rm nginx-h2-probe:ci --version
